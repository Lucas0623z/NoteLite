name: macOS desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'packaging/**'
      - 'data/examples/chula.png'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/macos-desktop.yml'
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'packaging/**'
      - 'data/examples/chula.png'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/macos-desktop.yml'

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
            java_architecture: aarch64
          - runner: macos-15-intel
            architecture: x86_64
            java_architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.java_architecture }}
          cache: gradle
      - name: Build and test Mac integration
        run: bash ./gradlew --no-daemon :app:test --tests com.notelite.omr.ui.MacApplicationTest
      - name: Create self-contained DMG
        run: bash ./gradlew --no-daemon :packaging:jpackage -PinstallerType=DMG
      - name: Validate packaged launcher, runtime and recognition
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          image=$(find packaging/build/dist -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$image"
          mountpoint="$RUNNER_TEMP/notelite-dmg"
          mkdir -p "$mountpoint"
          # jpackage embeds this repository's LICENSE in the DMG; hdiutil prompts before mounting.
          hdiutil attach "$image" -readonly -nobrowse -mountpoint "$mountpoint" <<< "Y"
          practice_pid=""
          cleanup() {
            if [ -n "$practice_pid" ]; then
              kill "$practice_pid" 2>/dev/null || true
              wait "$practice_pid" 2>/dev/null || true
            fi
            hdiutil detach "$mountpoint"
          }
          trap cleanup EXIT
          bundle="$mountpoint/NoteLite.app"
          lipo "$bundle/Contents/MacOS/NoteLite" -verify_arch "$EXPECTED_ARCH"
          "$bundle/Contents/runtime/Contents/Home/bin/java" -version
          "$bundle/Contents/MacOS/NoteLite" -help
          # Use only the installed runtime and jars, so missing jlink modules fail this check.
          practice_log="$RUNNER_TEMP/notelite-practice.log"
          "$bundle/Contents/runtime/Contents/Home/bin/java" --enable-preview -cp "$bundle/Contents/app/*" \
            com.notelite.omr.practice.PracticeStudio >"$practice_log" 2>&1 &
          practice_pid=$!
          practice_url=""
          for attempt in {1..30}; do
            practice_url=$(awk '/^http:\/\/127\.0\.0\.1:[0-9]+\/[0-9a-f-]+\/$/ { print; exit }' "$practice_log")
            if [ -n "$practice_url" ]; then break; fi
            if ! kill -0 "$practice_pid" 2>/dev/null; then
              cat "$practice_log"
              exit 1
            fi
            sleep 1
          done
          if [ -z "$practice_url" ]; then
            cat "$practice_log"
            echo 'Packaged practice server did not start within 30 seconds' >&2
            exit 1
          fi
          for asset in index.html app.js score.musicxml; do
            curl --fail --silent --show-error --max-time 10 \
              "${practice_url}${asset}" --output "$RUNNER_TEMP/notelite-$asset"
            test -s "$RUNNER_TEMP/notelite-$asset"
          done
          export TESSDATA_PREFIX="$RUNNER_TEMP/notelite-tessdata"
          mkdir -p "$TESSDATA_PREFIX"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata/4.1.0/eng.traineddata \
            --output "$TESSDATA_PREFIX/eng.traineddata"
          smoke_output="$RUNNER_TEMP/notelite-recognition"
          mkdir -p "$smoke_output"
          "$bundle/Contents/MacOS/NoteLite" -batch -transcribe -export -export-midi \
            -output "$smoke_output" -- "$GITHUB_WORKSPACE/data/examples/chula.png"
          test -n "$(find "$smoke_output" -name '*.mxl' -size +0c -print -quit)"
          test -n "$(find "$smoke_output" -name '*.mid' -size +0c -print -quit)"
      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: NoteLite-macos-${{ matrix.architecture }}-unsigned
          path: packaging/build/dist/*.dmg
          if-no-files-found: error
