name: Apple clients

on:
  push:
    branches: [main, master, codex/audiveris-apple-builds]
    paths:
      - "apple/**"
      - "practice-web/**"
      - "figma-ui/**"
      - "app/res/practice/**"
      - "tools/audiveris-port/manage-embedded-simulators.py"
      - "tools/audiveris-port/test_manage_embedded_simulators.py"
      - ".github/workflows/apple-client.yml"
  pull_request:
    paths:
      - "apple/**"
      - "practice-web/**"
      - "figma-ui/**"
      - "app/res/practice/**"
      - "tools/audiveris-port/manage-embedded-simulators.py"
      - "tools/audiveris-port/test_manage_embedded_simulators.py"
      - ".github/workflows/apple-client.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  embedded-bridge-interface:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select an installed stable Xcode
        run: bash apple/scripts/select-xcode.sh
      - name: Test release gates and real Apple certificate extraction
        run: python3 -B apple/release/test_cloud_release.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check embedded runtime interfaces and enabled production service
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun --sdk iphonesimulator clang++ -fsyntax-only -std=c++17 -fobjc-arc \
            -target arm64-apple-ios16.0-simulator -isysroot "$sdk" \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/darwin" \
            apple/EmbeddedOMRRuntime/Sources/EmbeddedJVM.mm
          xcrun swiftc -typecheck -parse-as-library -D EMBEDDED_OMR_RUNTIME \
            -target arm64-apple-ios16.0-simulator -sdk "$sdk" \
            -import-objc-header apple/EmbeddedOMRRuntime/Sources/EmbeddedJVM.h \
            apple/NoteLite/Models.swift apple/NoteLite/EmbeddedOMRInputPreparation.swift \
            apple/NoteLite/EmbeddedRecognitionService.swift
          xcrun swiftc -typecheck -parse-as-library \
            -target arm64-apple-ios16.0-simulator -sdk "$sdk" \
            -import-objc-header apple/EmbeddedOMRRuntime/Sources/EmbeddedJVM.h \
            apple/EmbeddedOMRProbe/Sources/EmbeddedOMRProbeApp.swift

  native-clients:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select an installed stable Xcode
        run: bash apple/scripts/select-xcode.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: practice-web/package-lock.json
      - name: Build and test bundled practice view
        working-directory: practice-web
        run: |
          npm ci
          npm test
          npm run build
      - name: Build the Figma interface and prepare native resources
        run: |
          npm install --global pnpm@11.25.0
          pnpm --dir figma-ui install --frozen-lockfile --ignore-scripts
          pnpm --dir figma-ui typecheck
          pnpm --dir figma-ui test
          pnpm --dir figma-ui build
          node apple/scripts/prepare-notewise-profiles.mjs
          python3 apple/scripts/prepare-notewise-model.py
          python3 -m unittest discover -s apple/scripts -p test_notewise_model_patch.py
          python3 -B -m unittest discover -s apple/scripts -p test_verify_simulator_identity.py
          python3 apple/scripts/prepare-release-features.py --check
          python3 apple/scripts/prepare-figma-ui.py
          python3 -B apple/release/legal_resources.py prepare
      - name: Generate Xcode project
        id: generate
        working-directory: apple
        run: |
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${sdk_version%%.*}" -ge 26
          XCODEGEN_BIN=$(bash scripts/install-xcodegen.sh)
          "$XCODEGEN_BIN" generate --spec project.yml
      - name: Build iOS simulator app without signing
        id: build_ios
        working-directory: apple
        run: |
          xcodebuild build -project NoteLite.xcodeproj -scheme NoteLite \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath Build \
            CODE_SIGNING_ALLOWED=NO
      - name: Build native macOS app without signing
        id: build_macos
        working-directory: apple
        run: |
          xcodebuild build -project NoteLite.xcodeproj -scheme NoteLiteMac \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath Build \
            CODE_SIGNING_ALLOWED=NO
      - name: Build iPhone and iPad arm64 app without signing
        working-directory: apple
        run: |
          xcodebuild build -project NoteLite.xcodeproj -scheme NoteLite \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath Build-device \
            CODE_SIGNING_ALLOWED=NO
          lipo Build-device/Build/Products/Release-iphoneos/NoteLite.app/NoteLite -verify_arch arm64
          ditto -c -k --keepParent Build-device/Build/Products/Release-iphoneos/NoteLite.app NoteLite-iOS-device-unsigned.zip
      - name: Verify bundled practice resources
        working-directory: apple
        shell: bash
        run: |
          set -euo pipefail
          for resources in \
            Build/Build/Products/Release-iphonesimulator/NoteLite.app \
            Build-device/Build/Products/Release-iphoneos/NoteLite.app \
            Build/Build/Products/Release/黑白键AI-你的陪练搭子.app/Contents/Resources; do
            python3 -B release/legal_resources.py verify --resources "$resources"
            for file in index.html app.js style.css demo.musicxml THIRD-PARTY.txt; do
              test -s "$resources/practice/$file"
            done
            if [ -d ../app/res/practice/icons ]; then
              diff -r ../app/res/practice/icons "$resources/practice/icons"
            fi
            test -s "$resources/FigmaUI/index.html"
            test -s "$resources/NoteWiseProfiles.json"
            test -d "$resources/NoteWiseBasicPitch.mlmodelc"
            test -s "$resources/BASIC-PITCH-LICENSE"
            test -s "$resources/MODEL-LOCK.json"
            for notice in MODEL-LOCK.json DIVIDE-NO-NAN-PATCH.json BASIC-PITCH-LICENSE THIRD-PARTY.txt; do
              cmp "NoteWiseModels/$notice" "$resources/$notice"
            done
            test -d "$resources/FigmaUI/assets"
            diff -r FigmaUI "$resources/FigmaUI"
          done
      - name: Package unsigned native builds
        working-directory: apple
        run: |
          ditto -c -k --keepParent Build/Build/Products/Release/黑白键AI-你的陪练搭子.app 黑白键AI-macOS-unsigned.zip
          ditto -c -k --keepParent Build/Build/Products/Release-iphonesimulator/NoteLite.app NoteLite-iOS-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: apple-native-builds
          path: |
            apple/黑白键AI-macOS-unsigned.zip
            apple/NoteLite-iOS-simulator.zip
            apple/NoteLite-iOS-device-unsigned.zip
      - name: Create a native CI display large enough for both Figma window sizes
        if: ${{ !cancelled() && steps.generate.outcome == 'success' && steps.build_macos.outcome == 'success' }}
        run: |
          set -euo pipefail
          mkdir -p apple/Screenshots/native-diagnostics
          xcrun clang -fobjc-arc -fblocks -framework Foundation -framework AppKit -framework CoreGraphics \
            apple/scripts/create-ui-test-display.m -o "$RUNNER_TEMP/notelite-ui-test-display"
          "$RUNNER_TEMP/notelite-ui-test-display" "$GITHUB_WORKSPACE/apple/Screenshots/native-diagnostics/native-test-display.json" \
            > "$RUNNER_TEMP/notelite-ui-test-display.log" 2>&1 &
          display_pid=$!
          echo "$display_pid" > "$RUNNER_TEMP/notelite-ui-test-display.pid"
          ready=0
          for attempt in $(seq 1 40); do
            if ! kill -0 "$display_pid" 2>/dev/null; then break; fi
            if [ -s apple/Screenshots/native-diagnostics/native-test-display.json ]; then
              if python3 -c 'import json; from pathlib import Path; raise SystemExit(not json.loads(Path("apple/Screenshots/native-diagnostics/native-test-display.json").read_text())["ready"])'; then
                ready=1
                break
              fi
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/notelite-ui-test-display.log"
          if [ "$ready" != 1 ]; then
            echo "::error::A real native display large enough for 900x1440 could not be created"
            exit 1
          fi
          cat apple/Screenshots/native-diagnostics/native-test-display.json
          swift apple/scripts/configure-ui-test-display.swift > apple/Screenshots/native-diagnostics/display-modes.json
          cat apple/Screenshots/native-diagnostics/display-modes.json
      - name: Test native macOS app
        if: ${{ !cancelled() && steps.generate.outcome == 'success' && steps.build_macos.outcome == 'success' }}
        working-directory: apple
        run: |
          xcodebuild test -project NoteLite.xcodeproj -scheme NoteLiteMac \
            -destination 'platform=macOS' -parallel-testing-enabled NO \
            -resultBundlePath TestResults-macOS.xcresult NOTELITE_LIVE_ACCOUNT_ACCEPTANCE=1 CODE_SIGNING_ALLOWED=NO
      - name: Export native Figma event diagnostics
        if: always()
        working-directory: apple
        run: |
          mkdir -p Screenshots/native-diagnostics
          for log in "$HOME/Library/Containers/com.notelite.mac/Data/Library/Caches/FigmaUITestDiagnostics.log" "$HOME/Library/Caches/FigmaUITestDiagnostics.log"; do
            if [ -f "$log" ]; then
              cp "$log" Screenshots/native-diagnostics/dialog-and-window.log
              break
            fi
          done
      - name: Remove the temporary native CI display
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/notelite-ui-test-display.pid" ]; then
            display_pid=$(cat "$RUNNER_TEMP/notelite-ui-test-display.pid")
            if kill -0 "$display_pid" 2>/dev/null; then kill -TERM "$display_pid"; fi
          fi
      - name: Export native interface screenshots
        if: always()
        working-directory: apple
        continue-on-error: true
        run: |
          export_failed=0
          for result in TestResults-*.xcresult; do
            if [ -d "$result" ]; then
              name="${result%.xcresult}"
              if ! xcrun xcresulttool export attachments --path "$result" --output-path "Screenshots/$name"; then
                echo "::warning::Could not export attachments from $result; continuing with other devices"
                export_failed=1
              fi
            fi
          done
          exit "$export_failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-client-test-results
          path: |
            apple/TestResults-*.xcresult
            apple/Screenshots/
          if-no-files-found: ignore

  simulator-test-build:
    name: Build signed simulator test products
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.upload_products.outputs.artifact-id }}
      archive_sha256: ${{ steps.package_products.outputs.archive_sha256 }}
    steps:
      - uses: actions/checkout@v4
      - name: Select an installed stable Xcode
        run: bash apple/scripts/select-xcode.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: practice-web/package-lock.json
      - name: Build bundled practice view
        working-directory: practice-web
        run: |
          npm ci
          npm run build
      - name: Build the Figma interface and prepare native resources
        run: |
          npm install --global pnpm@11.25.0
          pnpm --dir figma-ui install --frozen-lockfile --ignore-scripts
          pnpm --dir figma-ui typecheck
          pnpm --dir figma-ui test
          pnpm --dir figma-ui build
          python3 apple/scripts/prepare-figma-ui.py
          node apple/scripts/prepare-notewise-profiles.mjs
          python3 apple/scripts/prepare-notewise-model.py
          python3 -m unittest discover -s apple/scripts -p test_notewise_model_patch.py
          python3 -B -m unittest discover -s apple/scripts -p test_verify_simulator_identity.py
          python3 -B -m unittest discover -s apple/scripts -p test_simulator_test_products.py
          python3 -B -m unittest discover -s apple/scripts -p test_install_xcodegen.py
          python3 apple/scripts/prepare-release-features.py --check
          python3 -B apple/release/legal_resources.py prepare
      - name: Generate Xcode project
        working-directory: apple
        run: |
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${sdk_version%%.*}" -ge 26
          XCODEGEN_BIN=$(bash scripts/install-xcodegen.sh)
          "$XCODEGEN_BIN" generate --spec project.yml
      - name: Create and boot dedicated screenshot simulator
        id: simulator
        timeout-minutes: 5
        env:
          DEVICE_FAMILY: iPhone
        run: |
          set -euo pipefail
          python3 -B tools/audiveris-port/test_manage_embedded_simulators.py
          python3 tools/audiveris-port/manage-embedded-simulators.py create \
            apple/SimulatorResults --family "$DEVICE_FAMILY" --screenshot
          DEVICE_ID=$(python3 -c 'import json, os; from pathlib import Path; print(json.loads((Path("apple/SimulatorResults") / os.environ["DEVICE_FAMILY"] / "device.json").read_text())["udid"])')
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b | tee apple/SimulatorResults/boot.log
      - name: Build native interface and model for testing
        id: build_simulator_tests
        working-directory: apple
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          # Preserve the original scheme, default DerivedData and ad-hoc signing.
          # This job builds both test targets and never creates a test result bundle.
          xcodebuild build-for-testing -project NoteLite.xcodeproj -scheme NoteLite \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 360 \
            NOTELITE_SIM_SWIFT_PATH= NOTELITE_LIVE_ACCOUNT_ACCEPTANCE=1 \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_IDENTITY=-
      - name: Package and verify complete signed simulator test products
        id: package_products
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          python3 -B apple/scripts/simulator_test_products.py package \
            --archive apple/NoteLite-simulator-tests.tar.gz --device-id "$DEVICE_ID"
      - uses: actions/upload-artifact@v4
        id: upload_products
        with:
          name: apple-simulator-test-products
          path: apple/NoteLite-simulator-tests.tar.gz
          if-no-files-found: error
          compression-level: 0
      - name: Preserve the unmodified original test plan diagnostics
        if: always() && steps.build_simulator_tests.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: apple-simulator-original-test-plan
          path: apple/build/SimulatorProductDiagnostics/
          if-no-files-found: error
      - name: Remove dedicated build simulator
        if: always()
        run: python3 tools/audiveris-port/manage-embedded-simulators.py cleanup apple/SimulatorResults

  simulator-clients:
    name: ${{ matrix.family }} interface
    needs: simulator-test-build
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - name: Select an installed stable Xcode
        run: bash apple/scripts/select-xcode.sh
      - name: Require the exact producer artifact identity
        env:
          PRODUCT_ARTIFACT_ID: ${{ needs.simulator-test-build.outputs.artifact_id }}
          PRODUCT_ARCHIVE_SHA256: ${{ needs.simulator-test-build.outputs.archive_sha256 }}
        run: |
          [[ "$PRODUCT_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$PRODUCT_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.simulator-test-build.outputs.artifact_id }}
          path: apple/SimulatorTestDownload
          merge-multiple: true
      - name: Prepare the current commit source offer
        run: python3 -B apple/release/legal_resources.py prepare
      - name: Create and boot dedicated screenshot simulator
        id: simulator
        timeout-minutes: 5
        env:
          DEVICE_FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          python3 tools/audiveris-port/manage-embedded-simulators.py create \
            apple/SimulatorResults --family "$DEVICE_FAMILY" --screenshot
          DEVICE_ID=$(python3 -c 'import json, os; from pathlib import Path; print(json.loads((Path("apple/SimulatorResults") / os.environ["DEVICE_FAMILY"] / "device.json").read_text())["udid"])')
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b | tee apple/SimulatorResults/boot.log
      - name: Verify and restore the same-run signed test products
        id: restore_products
        env:
          PRODUCT_ARCHIVE_SHA256: ${{ needs.simulator-test-build.outputs.archive_sha256 }}
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          python3 -B apple/scripts/simulator_test_products.py restore \
            --archive apple/SimulatorTestDownload/NoteLite-simulator-tests.tar.gz \
            --destination "$RUNNER_TEMP/notelite-simulator-tests" \
            --expected-sha256 "$PRODUCT_ARCHIVE_SHA256" --device-id "$DEVICE_ID"
      - name: Test native interface and model
        if: ${{ success() && steps.restore_products.outcome == 'success' }}
        timeout-minutes: 25
        working-directory: apple
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
          XCTESTRUN_PATH: ${{ steps.restore_products.outputs.xctestrun_path }}
        run: |
          test ! -e 'TestResults-${{ matrix.family }}.xcresult'
          xcodebuild test-without-building -xctestrun "$XCTESTRUN_PATH" \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO -resultBundlePath 'TestResults-${{ matrix.family }}.xcresult' \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 360
      - name: Verify the actual simulator host signature and private Keychain identity
        if: always() && steps.simulator.outputs.device_id != ''
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          set -euo pipefail
          mkdir -p apple/Screenshots/native-diagnostics
          app_bundle=$(xcrun simctl get_app_container "$DEVICE_ID" com.lucas0623z.yinban app)
          python3 -B apple/release/legal_resources.py verify --resources "$app_bundle"
          python3 -B apple/scripts/verify_simulator_identity.py \
            --app "$app_bundle" \
            --output apple/Screenshots/native-diagnostics/simulator-host-signature.json
      - name: Export simulator Figma event diagnostics
        if: always()
        continue-on-error: true
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          mkdir -p apple/Screenshots/native-diagnostics
          if [ -n "${DEVICE_ID:-}" ]; then
            app_data=$(xcrun simctl get_app_container "$DEVICE_ID" com.lucas0623z.yinban data 2>/dev/null || true)
            if [ -n "$app_data" ] && [ -f "$app_data/Library/Caches/FigmaUITestDiagnostics.log" ]; then
              cp "$app_data/Library/Caches/FigmaUITestDiagnostics.log" apple/Screenshots/native-diagnostics/dialog-and-window.log
            fi
          fi
      - name: Remove dedicated simulator
        if: always()
        run: python3 tools/audiveris-port/manage-embedded-simulators.py cleanup apple/SimulatorResults
      - name: Export native interface screenshots
        if: always()
        working-directory: apple
        run: |
          result='TestResults-${{ matrix.family }}.xcresult'
          if [ -d "$result" ]; then
            xcrun xcresulttool export attachments --path "$result" --output-path 'Screenshots/TestResults-${{ matrix.family }}'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-client-test-results-${{ matrix.family }}
          path: |
            apple/TestResults-*.xcresult
            apple/Screenshots/
            apple/SimulatorResults/
          if-no-files-found: ignore
