name: Apple clients

on:
  push:
    branches: [main, master]
    paths:
      - "apple/**"
      - "practice-web/**"
      - "app/res/practice/**"
      - ".github/workflows/apple-client.yml"
  pull_request:
    paths:
      - "apple/**"
      - "practice-web/**"
      - "app/res/practice/**"
      - ".github/workflows/apple-client.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-clients:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: practice-web/package-lock.json
      - name: Build and test bundled practice view
        working-directory: practice-web
        run: |
          npm ci
          npm test
          npm run build
      - name: Generate Xcode project
        working-directory: apple
        run: |
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate --spec project.yml
      - name: Build universal iOS app without signing
        working-directory: apple
        run: |
          xcodebuild build -project NoteLite.xcodeproj -scheme NoteLite \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath Build \
            CODE_SIGNING_ALLOWED=NO
      - name: Build native macOS app without signing
        working-directory: apple
        run: |
          xcodebuild build -project NoteLite.xcodeproj -scheme NoteLiteMac \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath Build \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify bundled practice resources
        working-directory: apple
        shell: bash
        run: |
          set -euo pipefail
          for resources in \
            Build/Build/Products/Release-iphonesimulator/NoteLite.app \
            Build/Build/Products/Release/NoteLite.app/Contents/Resources; do
            for file in index.html app.js style.css demo.musicxml THIRD-PARTY.txt; do
              test -s "$resources/practice/$file"
            done
            if [ -d ../app/res/practice/icons ]; then
              diff -r ../app/res/practice/icons "$resources/practice/icons"
            fi
          done
      - name: Package unsigned native builds
        working-directory: apple
        run: |
          ditto -c -k --keepParent Build/Build/Products/Release/NoteLite.app NoteLite-macOS-unsigned.zip
          ditto -c -k --keepParent Build/Build/Products/Release-iphonesimulator/NoteLite.app NoteLite-iOS-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: apple-native-builds
          path: |
            apple/NoteLite-macOS-unsigned.zip
            apple/NoteLite-iOS-simulator.zip
      - name: Test native macOS app
        working-directory: apple
        run: |
          xcodebuild test -project NoteLite.xcodeproj -scheme NoteLiteMac \
            -destination 'platform=macOS' -parallel-testing-enabled NO \
            -resultBundlePath TestResults-macOS.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Test on iPhone and iPad simulators
        working-directory: apple
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/notelite-simulators.json"
          for family in iPhone iPad; do
            device_id=$(python3 - "$RUNNER_TEMP/notelite-simulators.json" "$family" <<'PY'
          import json, sys
          devices = json.load(open(sys.argv[1]))["devices"]
          found = [d["udid"] for runtime, rows in devices.items() if "iOS" in runtime
                   for d in rows if d.get("isAvailable") and sys.argv[2] in d["name"]]
          if not found:
              raise SystemExit("No available " + sys.argv[2] + " simulator")
          print(found[0])
          PY
            )
            xcodebuild test -project NoteLite.xcodeproj -scheme NoteLite \
              -destination "platform=iOS Simulator,id=$device_id" \
              -parallel-testing-enabled NO -resultBundlePath "TestResults-$family.xcresult" \
              CODE_SIGNING_ALLOWED=NO
            # Release the first simulator's memory before booting the other device family.
            xcrun simctl shutdown "$device_id" || true
          done
      - name: Export native interface screenshots
        if: always()
        working-directory: apple
        continue-on-error: true
        run: |
          for result in TestResults-*.xcresult; do
            if [ -d "$result" ]; then
              name="${result%.xcresult}"
              xcrun xcresulttool export attachments --path "$result" --output-path "Screenshots/$name"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-client-test-results
          path: |
            apple/TestResults-*.xcresult
            apple/Screenshots/
          if-no-files-found: ignore
