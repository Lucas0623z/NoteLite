name: Apple clients

# Documentation-only workflow on codex/ui-inventory. No signing, upload, or release jobs.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

concurrency:
  group: apple-ui-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-catalog:
    name: ${{ matrix.family }} UI catalog
    runs-on: macos-26
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad, macOS]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: practice-web/package-lock.json
      - name: Build bundled practice resources
        working-directory: practice-web
        run: |
          npm ci
          npm run build
      - name: Generate Xcode project
        working-directory: apple
        run: |
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate --spec project.yml
      - name: Create screenshot simulator
        if: matrix.family != 'macOS'
        id: simulator
        timeout-minutes: 5
        env:
          DEVICE_FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          python3 tools/audiveris-port/manage-embedded-simulators.py create apple/SimulatorResults --family "$DEVICE_FAMILY" --screenshot
          DEVICE_ID=$(python3 -c 'import json, os; from pathlib import Path; print(json.loads((Path("apple/SimulatorResults") / os.environ["DEVICE_FAMILY"] / "device.json").read_text())["udid"])')
          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl status_bar "$DEVICE_ID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
      - name: Capture real SwiftUI screens with labelled mock data
        working-directory: apple
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
          DEVICE_FAMILY: ${{ matrix.family }}
        run: |
          set -euo pipefail
          if [ "$DEVICE_FAMILY" = macOS ]; then
            scheme=NoteLiteMac
            tests=NoteLiteMacUITests
            destination='platform=macOS'
          else
            scheme=NoteLite
            tests=NoteLiteUITests
            destination="platform=iOS Simulator,id=$DEVICE_ID"
          fi
          xcodebuild test -project NoteLite.xcodeproj -scheme "$scheme" \
            -configuration Debug -destination "$destination" \
            -only-testing:"$tests/UICatalogUITests" -parallel-testing-enabled NO \
            -resultBundlePath "TestResults-Catalog-$DEVICE_FAMILY.xcresult" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 900 \
            -maximum-test-execution-time-allowance 1200 \
            NOTELITE_SIM_SWIFT_PATH= CODE_SIGNING_ALLOWED=NO
      - name: Export screenshots and provenance
        if: always()
        working-directory: apple
        env:
          DEVICE_FAMILY: ${{ matrix.family }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          result="TestResults-Catalog-$DEVICE_FAMILY.xcresult"
          output="Screenshots/$DEVICE_FAMILY"
          mkdir -p "$output"
          if [ -d "$result" ]; then
            xcrun xcresulttool export attachments --path "$result" --output-path "$output"
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          family = os.environ['DEVICE_FAMILY']
          target = Path('Screenshots') / family / 'catalog-provenance.json'
          target.write_text(json.dumps({
              'source_sha': os.environ['SOURCE_SHA'],
              'production_base_sha': '65d565bc97821b641734a1e47b29fca91cf800c2',
              'run_url': os.environ['RUN_URL'], 'platform': family,
              'data': 'simulated fixtures, visibly watermarked',
              'renderer': 'real SwiftUI native views',
              'recognition_engine_executed': False,
              'server_accessed': False,
              'scenes': ['empty','library','detail-new','detail-running','detail-failed','detail-ready','part-picker','source-preview','settings','privacy','history','review','error-alert']
          }, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-catalog-${{ matrix.family }}
          path: |
            apple/Screenshots/
            apple/TestResults-Catalog-*.xcresult
            apple/SimulatorResults/
          if-no-files-found: warn
      - name: Remove dedicated simulator
        if: always() && matrix.family != 'macOS'
        run: python3 tools/audiveris-port/manage-embedded-simulators.py cleanup apple/SimulatorResults
