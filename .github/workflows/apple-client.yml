name: Apple clients

on:
  push:
    branches: [main, master]
    paths:
      - "apple/**"
      - "practice-web/**"
      - "app/res/practice/**"
      - ".github/workflows/apple-client.yml"
  pull_request:
    paths:
      - "apple/**"
      - "practice-web/**"
      - "app/res/practice/**"
      - ".github/workflows/apple-client.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pin the stable toolchain; the runner also contains preview Xcode versions.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

concurrency:
  group: apple-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-clients:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: practice-web/package-lock.json
      - name: Build and test bundled practice view
        working-directory: practice-web
        run: |
          npm ci
          npm test
          npm run build
      - name: Generate Xcode project
        id: generate
        working-directory: apple
        run: |
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${sdk_version%%.*}" -ge 26
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate --spec project.yml
      - name: Build iOS simulator app without signing
        id: build_ios
        working-directory: apple
        run: |
          xcodebuild build -project NoteLite.xcodeproj -scheme NoteLite \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath Build \
            CODE_SIGNING_ALLOWED=NO
      - name: Build native macOS app without signing
        id: build_macos
        working-directory: apple
        run: |
          xcodebuild build -project NoteLite.xcodeproj -scheme NoteLiteMac \
            -configuration Release -destination 'platform=macOS' \
            -derivedDataPath Build \
            CODE_SIGNING_ALLOWED=NO
      - name: Verify bundled practice resources
        working-directory: apple
        shell: bash
        run: |
          set -euo pipefail
          for resources in \
            Build/Build/Products/Release-iphonesimulator/NoteLite.app \
            Build/Build/Products/Release/NoteLite.app/Contents/Resources; do
            for file in index.html app.js style.css demo.musicxml THIRD-PARTY.txt; do
              test -s "$resources/practice/$file"
            done
            if [ -d ../app/res/practice/icons ]; then
              diff -r ../app/res/practice/icons "$resources/practice/icons"
            fi
          done
      - name: Package unsigned native builds
        working-directory: apple
        run: |
          ditto -c -k --keepParent Build/Build/Products/Release/NoteLite.app NoteLite-macOS-unsigned.zip
          ditto -c -k --keepParent Build/Build/Products/Release-iphonesimulator/NoteLite.app NoteLite-iOS-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: apple-native-builds
          path: |
            apple/NoteLite-macOS-unsigned.zip
            apple/NoteLite-iOS-simulator.zip
      - name: Test native macOS app
        if: ${{ !cancelled() && steps.generate.outcome == 'success' && steps.build_macos.outcome == 'success' }}
        working-directory: apple
        run: |
          xcodebuild test -project NoteLite.xcodeproj -scheme NoteLiteMac \
            -destination 'platform=macOS' -parallel-testing-enabled NO \
            -resultBundlePath TestResults-macOS.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Export native interface screenshots
        if: always()
        working-directory: apple
        continue-on-error: true
        run: |
          export_failed=0
          for result in TestResults-*.xcresult; do
            if [ -d "$result" ]; then
              name="${result%.xcresult}"
              if ! xcrun xcresulttool export attachments --path "$result" --output-path "Screenshots/$name"; then
                echo "::warning::Could not export attachments from $result; continuing with other devices"
                export_failed=1
              fi
            fi
          done
          exit "$export_failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-client-test-results
          path: |
            apple/TestResults-*.xcresult
            apple/Screenshots/
          if-no-files-found: ignore

  simulator-clients:
    name: ${{ matrix.family }} interface
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: practice-web/package-lock.json
      - name: Build bundled practice view
        working-directory: practice-web
        run: |
          npm ci
          npm run build
      - name: Generate Xcode project
        working-directory: apple
        run: |
          xcodebuild -version
          sdk_version=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${sdk_version%%.*}" -ge 26
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate --spec project.yml
      - name: Select App Store screenshot simulator
        id: simulator
        env:
          DEVICE_FAMILY: ${{ matrix.family }}
        run: |
          python3 <<'PY'
          import json, os, subprocess

          def simctl(*args):
              return json.loads(subprocess.check_output(["xcrun", "simctl", *args, "--json"]))

          sdk_major = int(subprocess.check_output(["xcrun", "--sdk", "iphonesimulator", "--show-sdk-version"], text=True).split(".")[0])
          runtimes = {
              runtime["identifier"]: tuple(map(int, runtime["version"].split(".")))
              for runtime in simctl("list", "runtimes")["runtimes"]
              if runtime.get("isAvailable") and ".iOS-" in runtime["identifier"]
          }
          candidates = []
          for runtime, devices in simctl("list", "devices", "available")["devices"].items():
              version = runtimes.get(runtime, (0,))
              if version[0] < 26 or version[0] > sdk_major:
                  continue
              for device in devices:
                  name = device["name"]
                  fits = ("iPhone" in name and "Pro Max" in name) if os.environ["DEVICE_FAMILY"] == "iPhone" else ("iPad Pro" in name and "13-inch" in name)
                  if device.get("isAvailable") and fits:
                      candidates.append((version, name, device["udid"]))
          if not candidates:
              raise SystemExit("No iOS 26+ Pro Max iPhone or 13-inch iPad simulator is installed for " + os.environ["DEVICE_FAMILY"])
          version, name, device_id = max(candidates)
          print(f"Using {name}, iOS {'.'.join(map(str, version))}: {device_id}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"device_id={device_id}\n")
          PY
      - name: Test native interface and model
        timeout-minutes: 15
        working-directory: apple
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.device_id }}
        run: |
          trap 'xcrun simctl shutdown "$DEVICE_ID" >/dev/null 2>&1 || true' EXIT
          xcodebuild test -project NoteLite.xcodeproj -scheme NoteLite \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -parallel-testing-enabled NO -resultBundlePath 'TestResults-${{ matrix.family }}.xcresult' \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -maximum-test-execution-time-allowance 180 \
            NOTELITE_SIM_SWIFT_PATH= CODE_SIGNING_ALLOWED=NO
      - name: Export native interface screenshots
        if: always()
        working-directory: apple
        run: |
          result='TestResults-${{ matrix.family }}.xcresult'
          if [ -d "$result" ]; then
            xcrun xcresulttool export attachments --path "$result" --output-path 'Screenshots/TestResults-${{ matrix.family }}'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-client-test-results-${{ matrix.family }}
          path: |
            apple/TestResults-*.xcresult
            apple/Screenshots/
          if-no-files-found: ignore
