name: Audiveris embedded iPhone and iPad acceptance

on:
  push:
    branches: [codex/audiveris-ios-probe-builds]
  workflow_dispatch:
    inputs:
      runtime_run_id:
        description: Completed Mobile Runtime workflow run containing real headless artifacts
        required: false
        type: string
      ocr_run_id:
        description: Completed Native OCR workflow run containing real static JNI artifacts
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: audiveris-embedded-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  bridge-interface-check:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile the shared Objective-C++ and Swift interfaces against the actual iOS SDK
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun --sdk iphonesimulator clang++ -fsyntax-only -std=c++17 -fobjc-arc \
            -target arm64-apple-ios16.0-simulator -isysroot "$sdk" \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/darwin" \
            apple/EmbeddedOMRRuntime/Sources/EmbeddedJVM.mm
          xcrun swiftc -typecheck -parse-as-library -target arm64-apple-ios16.0-simulator -sdk "$sdk" \
            -import-objc-header apple/EmbeddedOMRRuntime/Sources/EmbeddedJVM.h \
            apple/EmbeddedOMRProbe/Sources/EmbeddedOMRProbeApp.swift
          xcrun swiftc -typecheck -parse-as-library -D EMBEDDED_OMR_RUNTIME \
            -target arm64-apple-ios16.0-simulator -sdk "$sdk" \
            -import-objc-header apple/EmbeddedOMRRuntime/Sources/EmbeddedJVM.h \
            apple/NoteLite/Models.swift apple/NoteLite/EmbeddedOMRInputPreparation.swift \
            apple/NoteLite/EmbeddedRecognitionService.swift
  compose-and-test:
    runs-on: macos-26
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: iphoneos
            runtime: device
          - sdk: iphonesimulator
            runtime: simulator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare XcodeGen
        run: |
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
      - name: Resolve explicit or pinned artifact workflow runs
        env:
          RUNTIME_RUN_INPUT: ${{ inputs.runtime_run_id }}
          OCR_RUN_INPUT: ${{ inputs.ocr_run_id }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('tools/audiveris-port/native-artifact-runs.json')
          pinned = json.loads(path.read_text()) if path.exists() else {}
          values = {
              'RUNTIME_RUN': os.environ.get('RUNTIME_RUN_INPUT') or pinned.get('runtime_run_id', ''),
              'OCR_RUN': os.environ.get('OCR_RUN_INPUT') or pinned.get('ocr_run_id', ''),
          }
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for key, value in values.items():
                  value = str(value)
                  if not value.isdigit():
                      raise SystemExit('Supply real successful artifact run IDs via inputs or native-artifact-runs.json')
                  output.write(key + '=' + value + '\n')
          PY
      - name: Download compiled runtime and OCR artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_PLATFORM: ${{ matrix.runtime }}
          OCR_SDK: ${{ matrix.sdk }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          evidence = {}
          for key, workflow in [('RUNTIME_RUN', 'audiveris-mobile-runtime.yml'),
                                ('OCR_RUN', 'audiveris-ios-ocr.yml')]:
              run = json.loads(subprocess.check_output([
                  'gh', 'api', 'repos/' + os.environ['GITHUB_REPOSITORY'] +
                  '/actions/runs/' + os.environ[key]], text=True))
              if (run['status'] != 'completed' or run['conclusion'] != 'success'
                      or run['path'] != '.github/workflows/' + workflow):
                  raise SystemExit('Expected a successful completed ' + workflow + ': ' + run['html_url'])
              evidence[key] = {name: run[name] for name in
                              ('id', 'head_sha', 'path', 'html_url', 'status', 'conclusion')}
          target = Path('build/incoming/source-runs.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(evidence, indent=2) + '\n')
          PY
          gh run download "$RUNTIME_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "audiveris-ios-runtime-$RUNTIME_PLATFORM" --dir build/incoming/runtime
          gh run download "$OCR_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "audiveris-ocr-$OCR_SDK-arm64" --dir build/incoming/ocr
          python3 - <<'PY'
          import os
          from pathlib import Path
          runtime = list(Path('build/incoming/runtime').rglob('headless/runtime/lib/modules'))
          ocr = list(Path('build/incoming/ocr').rglob('install/lib/libjnitesseract.a'))
          if len(runtime) != 1 or len(ocr) != 1:
              raise SystemExit('Artifacts do not contain exactly one complete headless runtime and OCR installation')
          inventories = list(Path('build/incoming/runtime').rglob('runtime-inventory.json'))
          if len(inventories) != 1:
              raise SystemExit('Expected one runtime build inventory')
          import json
          inventory = json.loads(inventories[0].read_text())
          pinned = json.loads(Path('tools/audiveris-port/native-artifact-runs.json').read_text())
          if (inventory.get('source_commit') != pinned['openjdk_source_commit']
                  or inventory.get('platform') != os.environ['RUNTIME_PLATFORM']
                  or inventory.get('vm') != 'zero'
                  or inventory.get('headless_build_exit_code') != 0
                  or not inventory.get('java_desktop_jmod')
                  or not inventory.get('runtime_module_image')):
              raise SystemExit('The downloaded runtime does not match the required source, platform, or complete build')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('EMBEDDED_RUNTIME=' + str(runtime[0].parents[2].resolve()) + '\n')
              output.write('EMBEDDED_OCR=' + str(ocr[0].parents[1].resolve()) + '\n')
          PY
      - name: Build actual same-process JNI app
        env:
          PROBE_SDK: ${{ matrix.sdk }}
        run: |
          bash tools/audiveris-port/build-embedded-probe.sh "$PROBE_SDK" \
            "$EMBEDDED_RUNTIME" "$EMBEDDED_OCR" "build/embedded-probe/$PROBE_SDK-arm64"
      - name: Run full recognition on iPhone and iPad simulators
        if: matrix.sdk == 'iphonesimulator'
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          def data(*arguments):
              return json.loads(subprocess.check_output(['xcrun', 'simctl', *arguments, '--json']))
          sdk_major = int(subprocess.check_output(['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version'],
                                                  text=True).split('.')[0])
          runtimes = {r['identifier']: r for r in data('list', 'runtimes')['runtimes']
                      if r.get('isAvailable') and r['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-')
                      and 26 <= int(r['version'].split('.')[0]) <= sdk_major}
          available = data('list', 'devices', 'available')['devices']
          app = 'build/embedded-probe/iphonesimulator-arm64/EmbeddedOMRProbe.app'
          for family in ['iPhone', 'iPad']:
              candidates = [(tuple(map(int, runtimes[runtime]['version'].split('.'))),
                             d['name'], d['udid'], runtime, d)
                            for runtime, devices in available.items() if runtime in runtimes
                            for d in devices if d.get('isAvailable') and d['name'].startswith(family)]
              if not candidates:
                  raise SystemExit('No compatible available ' + family + ' simulator is installed')
              _, _, device, runtime_id, details = max(candidates, key=lambda entry: entry[:3])
              runtime = runtimes[runtime_id]
              output = Path('build/embedded-probe/iphonesimulator-arm64/simulator-results') / family
              output.mkdir(parents=True, exist_ok=True)
              (output / 'device.json').write_text(json.dumps({'udid':device, 'device':details, 'runtime':runtime}, indent=2))
              try:
                  subprocess.run(['bash', 'tools/audiveris-port/run-embedded-probe.sh', app, device, str(output)], check=True)
              finally:
                  subprocess.run(['xcrun', 'simctl', 'shutdown', device], check=False)
          PY
      - name: Compose the actual offline NoteLite app from the same runtime and resources
        env:
          APP_SDK: ${{ matrix.sdk }}
          NOTELITE_EMBEDDED_ARCHIVE: ${{ matrix.sdk == 'iphoneos' && '1' || '0' }}
        run: |
          bash tools/audiveris-port/build-embedded-app.sh "$APP_SDK" \
            "build/embedded-probe/$APP_SDK-arm64/embedding" "build/embedded-app/$APP_SDK-arm64"
      - name: Exercise offline recognition and practice in the actual iPhone and iPad app
        if: matrix.sdk == 'iphonesimulator'
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          for family in ['iPhone', 'iPad']:
              probe = Path('build/embedded-probe/iphonesimulator-arm64/simulator-results') / family
              device = json.loads((probe / 'device.json').read_text())['udid']
              output = Path('build/embedded-app/iphonesimulator-arm64/ui-results') / family
              try:
                  subprocess.run(['bash', 'tools/audiveris-port/run-embedded-app-tests.sh',
                                  'build/embedded-app/iphonesimulator-arm64', device, str(output)], check=True)
              finally:
                  subprocess.run(['xcrun', 'simctl', 'shutdown', device], check=False)
          PY
      - name: Preserve app, actual scores, logs, and semantic comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedded-omr-probe-${{ matrix.sdk }}-arm64
          if-no-files-found: warn
          path: |
            build/incoming/source-runs.json
            build/embedded-probe/${{ matrix.sdk }}-arm64/EmbeddedOMRProbe.app/
            build/embedded-probe/${{ matrix.sdk }}-arm64/evidence/
            build/embedded-probe/${{ matrix.sdk }}-arm64/embedding/native-symbols.c
            build/embedded-probe/${{ matrix.sdk }}-arm64/embedding/native-libraries.xcconfig
            build/embedded-probe/${{ matrix.sdk }}-arm64/simulator-results/
            build/embedded-app/${{ matrix.sdk }}-arm64/NoteLite.app/
            build/embedded-app/${{ matrix.sdk }}-arm64/NoteLite.xcarchive.zip
            build/embedded-app/${{ matrix.sdk }}-arm64/evidence/
            build/embedded-app/${{ matrix.sdk }}-arm64/ui-results/
