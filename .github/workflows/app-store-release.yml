name: iOS App Store release

on:
  push:
    branches: [codex/audiveris-release-builds]
  pull_request:
    paths:
      - "apple/**"
      - "mobile-ui/**"
      - "practice-web/**"
      - "app/res/practice/**"
      - "tools/audiveris-port/**"
      - ".github/workflows/app-store-release.yml"
  workflow_dispatch:
    inputs:
      engine:
        description: "Cloud OMR mobile client; embedded keeps the legacy full-engine archive route"
        type: choice
        options: [cloud, embedded]
        default: cloud
      mode:
        description: "verify = unsigned device archive; export = signed App Store IPA"
        type: choice
        options: [verify, export]
        default: verify
      upload:
        description: "Validate and upload the signed IPA to App Store Connect (requires export)"
        type: boolean
        default: false
      bundle_id:
        description: "Registered App ID / App Store Connect bundle ID"
        type: string
        default: com.lucas0623z.yinban
      team_id:
        description: "Apple Developer Team ID (required for export)"
        type: string
      version:
        description: "App Store version"
        type: string
        default: "1.0.0"
      build_number:
        description: "New build number; empty uses the workflow run number"
        type: string
      acceptance_run_id:
        description: "Successful Apple clients run for cloud, or full embedded acceptance run for legacy engine; exact commit required"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: app-store-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'verify' }}
      RELEASE_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload && 'true' || 'false' }}
      RELEASE_BUNDLE_ID: ${{ inputs.bundle_id || 'com.lucas0623z.yinban' }}
      RELEASE_TEAM_ID: ${{ inputs.team_id }}
      RELEASE_VERSION: ${{ inputs.version || '1.0.0' }}
      RELEASE_BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
      RELEASE_ACCEPTANCE_RUN: ${{ inputs.acceptance_run_id }}
      RELEASE_ENGINE: ${{ inputs.engine || 'cloud' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Test native build provenance gates
        run: |
          python3 tools/audiveris-port/test_download_native_artifacts.py
          python3 -B apple/release/test_release.py
      - uses: actions/setup-java@v4
        if: env.RELEASE_ENGINE == 'embedded'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: practice-web/package-lock.json
      - name: Select stable Xcode and check release inputs
        run: python3 apple/release/release.py prepare
      - name: Build and test bundled practice view
        working-directory: practice-web
        run: |
          npm ci
          npm test
          npm run build
      - name: Build bundled mobile interface
        working-directory: mobile-ui
        run: |
          npm ci
          npm run typecheck
          npm test --if-present
          npm run build
          mkdir -p ../apple/NoteLite/MobileUI
          cp -R dist/. ../apple/NoteLite/MobileUI/
      - name: Prepare complete native artifacts and validate accepted source before export
        if: env.RELEASE_ENGINE == 'embedded'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          arguments=(--platform device --destination build/release-native)
          if [ "$RELEASE_MODE" = export ]; then
            if [ -z "$RELEASE_ACCEPTANCE_RUN" ]; then
              echo "Export requires a successful full embedded acceptance run for this source commit." >&2
              exit 1
            fi
            arguments+=(--acceptance-run "$RELEASE_ACCEPTANCE_RUN" --source-sha "$GITHUB_SHA")
          fi
          python3 tools/audiveris-port/download-native-artifacts.py "${arguments[@]}"
      - name: Compose the complete offline release application
        if: env.RELEASE_ENGINE == 'embedded'
        run: |
          bash tools/audiveris-port/build-embedded-probe.sh iphoneos \
            "$EMBEDDED_RUNTIME" "$EMBEDDED_OCR" build/release-embedded-probe
          bash tools/audiveris-port/build-embedded-app.sh iphoneos \
            build/release-embedded-probe/embedding build/release-embedded-app
          printf 'RELEASE_EMBEDDED_BUILD=%s\n' "$GITHUB_WORKSPACE/build/release-embedded-app" >> "$GITHUB_ENV"
      - name: Generate cloud client without embedded JVM
        if: env.RELEASE_ENGINE == 'cloud'
        working-directory: apple
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate --spec project.yml
      - name: Verify unsigned iOS device archive
        if: env.RELEASE_MODE == 'verify'
        run: python3 apple/release/release.py archive
      - name: Export signed IPA and optionally upload
        if: github.event_name == 'workflow_dispatch' && env.RELEASE_MODE == 'export'
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
        run: python3 apple/release/release.py archive
      - name: Remove temporary signing credentials
        if: always()
        run: python3 apple/release/release.py cleanup
      - name: Preserve JNI verification diagnostics even after a rejected archive or IPA
        if: always()
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          source = Path(os.environ['RUNNER_TEMP']) / 'yinban-release-output'
          destination = Path('build/release-embedded-app/evidence')
          for report in source.glob('embedded-*-jni-bindings.json'):
              destination.mkdir(parents=True, exist_ok=True)
              shutil.copy2(report, destination / report.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yinban-ios-${{ env.RELEASE_MODE }}-${{ env.RELEASE_BUILD_NUMBER }}
          path: |
            ${{ runner.temp }}/yinban-release-output/Yinban.xcarchive.zip
            ${{ runner.temp }}/yinban-release-output/export/*.ipa
            ${{ runner.temp }}/yinban-release-output/embedded-archive-inventory.json
            ${{ runner.temp }}/yinban-release-output/embedded-ipa-inventory.json
            ${{ runner.temp }}/yinban-release-output/cloud-archive-inventory.json
            ${{ runner.temp }}/yinban-release-output/cloud-ipa-inventory.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve embedded build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yinban-embedded-evidence-${{ env.RELEASE_BUILD_NUMBER }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/release-native/source-runs.json
            build/release-native/accepted-run.json
            build/release-embedded-probe/evidence/
            build/release-embedded-app/evidence/
