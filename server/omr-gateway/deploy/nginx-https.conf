# Managed by NoteLite OMR gateway deployment v1
server {
    listen 80;
    server_name 124.221.211.156;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/notelite-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://124.221.211.156$request_uri; }
}

server {
    listen 443 ssl;
    server_name 124.221.211.156;
    if ($host != 124.221.211.156) { return 444; }
    ssl_certificate /etc/letsencrypt/live/124.221.211.156/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/124.221.211.156/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NoteLiteTLS:5m;
    ssl_session_timeout 1h;
    root /var/www/notelite-ui;
    index index.html;
    client_max_body_size 32m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "microphone=(self), camera=()" always;
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host 124.221.211.156;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 190s;
        proxy_send_timeout 190s;
        proxy_buffering off;
        add_header Cache-Control no-store always;
    }
    location = /index.html { add_header Cache-Control no-store always; }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / { try_files $uri $uri/ /index.html; }
}
