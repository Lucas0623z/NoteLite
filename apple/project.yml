name: NoteLite
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: G74YSFJX76
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  AudiverisCore:
    path: AudiverisCore
targets:
  NoteLite:
    type: application
    platform: iOS
    sources:
      - path: NoteLite
        excludes: ["**/*.plist", "**/*.entitlements", "NoteWiseProfiles.json"]
      - path: NoteLite/NoteWiseProfiles.json
        buildPhase: resources
      - path: ../native/audio/pitch.c
      - path: ../native/audio/events.c
      - path: NoteWiseModels/NoteWiseBasicPitch.mlpackage
        type: file
        buildPhase: sources
      - path: NoteWiseModels/THIRD-PARTY.txt
        buildPhase: resources
      - path: NoteWiseModels/BASIC-PITCH-LICENSE
        buildPhase: resources
      - path: NoteWiseModels/MODEL-LOCK.json
        buildPhase: resources
      - path: ../app/res/practice
        type: folder
        buildPhase: resources
      - path: FigmaUI
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lucas0623z.yinban
        PRODUCT_NAME: NoteLite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NoteLite/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: NoteLite/NoteWise-Bridging-Header.h
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: AudiverisCore
      - sdk: SwiftUI.framework
      - sdk: QuickLook.framework
      - sdk: PDFKit.framework
      - sdk: QuickLookThumbnailing.framework
      - sdk: Security.framework
      - sdk: WebKit.framework
      - sdk: CoreMIDI.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: CryptoKit.framework
      - sdk: CoreML.framework
      - sdk: ImageIO.framework
  NoteLiteMac:
    type: application
    platform: macOS
    productName: 黑白键AI-你的陪练搭子
    sources:
      - path: NoteLite
        excludes: ["**/*.plist", "**/*.entitlements", "NoteWiseProfiles.json"]
      - path: NoteLite/NoteWiseProfiles.json
        buildPhase: resources
      - path: ../native/audio/pitch.c
      - path: ../native/audio/events.c
      - path: NoteWiseModels/NoteWiseBasicPitch.mlpackage
        type: file
        buildPhase: sources
      - path: NoteWiseModels/THIRD-PARTY.txt
        buildPhase: resources
      - path: NoteWiseModels/BASIC-PITCH-LICENSE
        buildPhase: resources
      - path: NoteWiseModels/MODEL-LOCK.json
        buildPhase: resources
      - path: ../app/res/practice
        type: folder
        buildPhase: resources
      - path: FigmaUI
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notelite.mac
        PRODUCT_NAME: 黑白键AI-你的陪练搭子
        EXECUTABLE_NAME: NoteLite
        PRODUCT_MODULE_NAME: NoteLite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 5.13.1
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: NoteLite/Info-macOS.plist
        SWIFT_OBJC_BRIDGING_HEADER: NoteLite/NoteWise-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: NoteLite/NoteLite-macOS.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: AudiverisCore
      - sdk: SwiftUI.framework
      - sdk: QuickLook.framework
      - sdk: PDFKit.framework
      - sdk: QuickLookThumbnailing.framework
      - sdk: Security.framework
      - sdk: WebKit.framework
      - sdk: CoreMIDI.framework
      - sdk: AVFoundation.framework
      - sdk: AVKit.framework
      - sdk: CryptoKit.framework
      - sdk: CoreML.framework
      - sdk: ImageIO.framework
  NoteLiteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NoteLiteTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notelite.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: NoteLite
      - package: AudiverisCore
  NoteLiteMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - NoteLiteTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notelite.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/黑白键AI-你的陪练搭子.app/Contents/MacOS/NoteLite"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: NoteLiteMac
      - package: AudiverisCore
  NoteLiteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: NoteLiteUITests
        excludes: ["Fixtures/**"]
      - path: NoteLiteUITests/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notelite.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: NoteLite
  NoteLiteMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: NoteLiteUITests
        excludes: ["Fixtures/**"]
      - path: NoteLiteUITests/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.notelite.mac.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NoteLiteMac
    dependencies:
      - target: NoteLiteMac
schemes:
  NoteLite:
    build:
      targets:
        NoteLite: all
        NoteLiteTests: [test]
        NoteLiteUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      macroExpansion: NoteLite
      environmentVariables:
        NOTELITE_SIM_SWIFT_PATH: "$(NOTELITE_SIM_SWIFT_PATH)"
        DYLD_FALLBACK_LIBRARY_PATH: "$(NOTELITE_SIM_SWIFT_PATH)"
        NOTELITE_LIVE_ACCOUNT_ACCEPTANCE: "$(NOTELITE_LIVE_ACCOUNT_ACCEPTANCE)"
      targets:
        - NoteLiteTests
        - NoteLiteUITests
    archive:
      config: Release
  NoteLiteMac:
    build:
      targets:
        NoteLiteMac: all
        NoteLiteMacTests: [test]
        NoteLiteMacUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      macroExpansion: NoteLiteMac
      environmentVariables:
        NOTELITE_LIVE_ACCOUNT_ACCEPTANCE: "$(NOTELITE_LIVE_ACCOUNT_ACCEPTANCE)"
      targets:
        - NoteLiteMacTests
        - NoteLiteMacUITests
    archive:
      config: Release
