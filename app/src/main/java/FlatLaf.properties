# FlatLaf global defaults — picked up automatically by FlatLaf at LAF init
# Apple-style rounded corners

Component.arc=14
Button.arc=14
CheckBox.arc=6
TextComponent.arc=10
ProgressBar.arc=999
ScrollBar.thumbArc=999
ScrollBar.thumbInsets=2,2,2,2

# Make the JSplitPane divider visible — default sits flush with the
# panel background which makes the log/main boundary easy to miss.
SplitPane.background=#7a7a7a
SplitPane.dividerSize=10
SplitPaneDivider.draggingColor=#5a5a5a
SplitPaneDivider.gripColor=#404040
SplitPaneDivider.style=grip

# LAF window decorations are disabled via -Dflatlaf.useWindowDecorations=false
# in build.gradle (FlatLaf would otherwise embed the JMenuBar — which also
# hosts gauges — into its custom title strip on Windows 10+).
TitlePane.menuBarEmbedded=false

# Slightly cleaner focus ring
Component.focusWidth=2
Component.innerFocusWidth=0

# A bit more breathing room on inputs / buttons
Button.margin=4,12,4,12
TextComponent.margin=2,6,2,6

# System font (used on Windows; macOS already picks SF)
defaultFont=Segoe UI 13
