missing = 尚未找到 PianoBooster。它是独立运行的免费钢琴陪练软件。\n连接 MIDI 电子键盘，在 MIDI Setup 中选择输入，再使用 Follow You 模式。\n它会跟随弹奏并标记错音、节奏偏差；不支持原声乐器麦克风输入。\n可以选择程序、前往官网下载，或保存当前乐章的 MIDI 交给其他陪练软件。
overwrite = 替换已有的 MIDI 文件？
error = 无法打开 PianoBooster。可以保存 MIDI 后手动打开。
