<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">黑白键 · 小猫账号图标 · 深色模式</title>
  <desc id="desc">透明背景的小猫账号图标。柔白猫脸、黑色琴键刘海和眨眼表情，浅色外轮廓适配深色界面。</desc>
  <g stroke="#29292F" stroke-linecap="round" stroke-linejoin="round">
    <!-- Pale outer edges keep the ears and shoulders visible on dark surfaces. -->
    <path d="M28 115C28 99 43 89 64 89S100 99 100 115C100 119 97 121 93 121H35C31 121 28 119 28 115Z" fill="#29292F" stroke="#D8D8DF" stroke-width="5"/>
    <path d="M49 100C53 97 58 96 64 96S75 97 79 100L84 118H44L49 100Z" fill="#E6E6EC" stroke="none"/>

    <path d="M25 49L21 17C20.5 13 23 11 26 13L46 29C57 25 71 25 82 29L102 13C105 11 107.5 13 107 17L103 49C109 56 112 64 110 73C107 87 89 96 64 96S21 87 18 73C16 64 19 56 25 49Z" fill="#E6E6EC" stroke="none"/>
    <path d="M25 49L21 17C20.5 13 23 11 26 13L46 29C37 34 30 40 25 49Z" fill="#29292F" stroke="none"/>
    <path d="M103 49L107 17C107.5 13 105 11 102 13L82 29C91 34 98 40 103 49Z" fill="#29292F" stroke="none"/>
    <path d="M29 25L32 37L37 32L29 25Z" fill="#E6E6EC" stroke="none"/>
    <path d="M99 25L96 37L91 32L99 25Z" fill="#E6E6EC" stroke="none"/>

    <!-- Preserve the three black piano keys from the original character. -->
    <path d="M41 30L46 49Q46.5 52 49.5 51.5L55 50.5Q57.5 50 57 47.5L54 27C50 27.5 45 28.5 41 30Z" fill="#29292F" stroke="none"/>
    <path d="M60 28.5L62 45Q62.4 48 65.4 47.5L71 46.5Q73.5 46 73 43.5L71 28.7C67.5 28.3 63.7 28.2 60 28.5Z" fill="#29292F" stroke="none"/>
    <path d="M78 27L79.5 40.5Q80 43 82.5 42.5L87 41.5Q89.5 41 89 38.5L90 30C86 28.5 82 27.5 78 27Z" fill="#29292F" stroke="none"/>

    <!-- Draw the rim after the ear fills so it remains continuous. -->
    <path d="M25 49L21 17C20.5 13 23 11 26 13L46 29C57 25 71 25 82 29L102 13C105 11 107.5 13 107 17L103 49C109 56 112 64 110 73C107 87 89 96 64 96S21 87 18 73C16 64 19 56 25 49Z" stroke="#D8D8DF" stroke-width="5"/>

    <path d="M35 65C40 59 47 59 52 64" stroke-width="5.5"/>
